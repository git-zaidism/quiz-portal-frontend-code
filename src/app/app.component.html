<div class="app-frame">
  <router-outlet />
</div>

<app-confirmation-dialog />

<div class="toast-stack">
  @for (item of notifications.items(); track item.id) {
    <article
      class="toast"
      [class.success]="item.tone === 'success'"
      [class.error]="item.tone === 'error'"
      [class.info]="item.tone === 'info'"
    >
      <div>
        <strong>{{ item.title }}</strong>
        <p>{{ item.message }}</p>
      </div>
      <button type="button" (click)="notifications.remove(item.id)" aria-label="Dismiss">
        ×
      </button>
    </article>
  }
</div>
